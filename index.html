<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Quotes | Festival Wisdom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Hind:wght@400;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="loading.svg" type="image/x-icon">
    <style>
        :root {
            --light-bg: #f5f5f5; --light-text: #333; --light-card: #ffffff;
            --light-primary: #6a5acd; --light-secondary: #6c757d;
            --dark-bg: #1a1a2e; --dark-text: #f8f9fa; --dark-card: #16213e;
            --dark-primary: #9370db; --dark-secondary: #a7a7a7;
        }
        body { font-family: 'Poppins', sans-serif; transition: all 0.3s ease; min-height: 100vh; padding: 20px; user-select: none; }
        body.light-mode { background-color: var(--light-bg); color: var(--light-text); }
        body.dark-mode { background-color: var(--dark-bg); color: var(--dark-text); }
        .theme-switcher { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .app-title { color: var(--light-primary); margin-bottom: 1rem; }
        .dark-mode .app-title { color: var(--dark-primary); }
        .quote-card { background-color: var(--light-card); border-radius: 12px; padding: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: all 0.3s ease; margin-bottom: 20px; position: relative; min-height: 200px; }
        .dark-mode .quote-card { background-color: var(--dark-card); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .quote-text { font-family: 'Hind', sans-serif; font-size: 1.3rem; line-height: 1.8; margin-bottom: 12px; padding-right: 30px; }
        .quote-author { font-weight: 600; text-align: right; font-style: italic; margin-bottom: 2px; }
        .light-mode .quote-author { color: var(--light-primary); }
        .dark-mode .quote-author { color: var(--dark-primary); }
        .quote-type { font-size: 0.82rem; text-align: right; font-weight: 500; opacity: 0.75; }
        .light-mode .quote-type { color: var(--light-secondary); }
        .dark-mode .quote-type { color: var(--dark-secondary); }
        .festival-badge { background-color: #e67e22 !important; color: white !important; }
        .time-badge { background-color: #27ae60 !important; color: white !important; }
        .btn-primary { background-color: var(--light-primary); border: none; }
        .dark-mode .btn-primary { background-color: var(--dark-primary); }
        .btn-secondary { background-color: var(--light-secondary); border: none; }
        .dark-mode .btn-secondary { background-color: var(--dark-secondary); }
        .quote-icon { font-size: 2rem; opacity: 0.7; margin-bottom: 15px; }
        .light-mode .quote-icon { color: var(--light-primary); }
        .dark-mode .quote-icon { color: var(--dark-primary); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        footer { margin-top: 30px; color: #e67e22; }
        .dark-mode footer { color: #e67e22; }
        .copy-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--light-secondary); cursor: pointer; opacity: 0.5; transition: all 0.2s; font-size: 1.2rem; }
        .dark-mode .copy-btn { color: var(--dark-secondary); }
        .copy-btn:hover { opacity: 1; transform: scale(1.1); }
        .copy-btn.copied { color: #28a745; opacity: 1; }
        .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; }
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; }
        .toast { background-color: rgba(40,167,69,0.9); color: white; border: none; }
        .wishing-card { background: linear-gradient(135deg, #6a5acd22, #e67e2222); border-left: 4px solid #e67e22; border-radius: 10px; padding: 14px 20px; margin-bottom: 18px; font-family: 'Hind', sans-serif; font-size: 1.05rem; line-height: 1.6; display: flex; align-items: center; gap: 12px; }
        .dark-mode .wishing-card { background: linear-gradient(135deg, #9370db22, #e67e2222); }
        .wishing-icon { font-size: 1.6rem; flex-shrink: 0; }
        @media (max-width: 768px) {
            .quote-card { padding: 20px 15px; min-height: 180px; }
            .quote-text { font-size: 1.1rem; padding-right: 25px; }
            .copy-btn { top: 15px; right: 15px; font-size: 1rem; }
        }
    </style>
</head>
<body class="light-mode">
    <div class="theme-switcher">
        <button id="theme-toggle" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
    </div>
    <div class="container">
        <header class="text-center my-4">
            <h1 class="display-5 fw-bold app-title">Hindi Wisdom</h1>
            <div class="date-display mt-2">
                <span id="current-date" class="badge bg-primary"></span>
                <span id="time-greeting" class="badge ms-2 time-badge"></span>
                <span id="current-festival" class="badge ms-2 festival-badge" style="display:none"></span>
            </div>
        </header>
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div id="wishing-card" class="wishing-card fade-in">
                    <span id="wishing-icon" class="wishing-icon"></span>
                    <span id="wishing-text"></span>
                </div>
                <div class="quote-card">
                    <button class="copy-btn" title="Copy quote"><i class="far fa-copy"></i></button>
                    <div class="quote-icon"><i class="fas fa-quote-left"></i></div>
                    <div class="quote-content">
                        <p id="quote-text" class="quote-text">Quote load ho raha hai...</p>
                        <p id="quote-author" class="quote-author"></p>
                        <p id="quote-type" class="quote-type"></p>
                    </div>
                    <div class="quote-actions mt-4">
                        <button id="new-quote" class="btn btn-primary me-3"><i class="fas fa-sync-alt me-2"></i>New Quote</button>
                        <button id="share-quote" class="btn btn-secondary"><i class="fas fa-share-alt me-2"></i>Share</button>
                    </div>
                    <div id="loading-spinner" class="loading-spinner" style="display:none;">
                        <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                          <circle cx="50" cy="50" r="35" stroke-width="10" stroke="#FF3D00" fill="none" stroke-dasharray="164.93" stroke-dashoffset="0">
                            <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1s" repeatCount="indefinite"/>
                            <animate attributeName="stroke" values="#FF3D00;#FFD600;#00E676;#00B0FF;#FF3D00" dur="4s" repeatCount="indefinite"/>
                          </circle>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        <footer class="text-center mt-4">
            <p>By <a target="_blank" href="http://instagram.com/ohi_abhist">@ohi_abhist</a> | Hindi Quotes | Festival Wisdom</p>
        </footer>
    </div>

    <div class="toast-container">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body"><i class="fas fa-check-circle me-2"></i> Quote copied to clipboard!</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                alert('Developer tools are disabled.');
            }
        });
        document.addEventListener('selectstart', e => e.preventDefault());

        document.addEventListener('DOMContentLoaded', function () {
            const toastEl = document.getElementById('toast');
            const toast = new bootstrap.Toast(toastEl, { autohide: true, delay: 2000 });

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
                } else {
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark Mode';
                }
            });

            // Festivals
            const festivals = {
                '01-14': 'Makar Sankranti', '01-26': 'Republic Day',
                '03-08': 'Holi', '08-15': 'Independence Day',
                '10-24': 'Diwali', '11-12': 'Guru Nanak Jayanti'
            };

            // Time-based wishing
            const wishingQuotes = {
                morning:   { icon: '🌅', label: 'Good Morning',   quotes: ['सुप्रभात! 🌸 हर सुबह एक नई शुरुआत है — आज का दिन आपका हो।', 'सुप्रभात! ☀️ उठो, जागो और अपने सपनों की ओर बढ़ो।', 'सुप्रभात! 🌻 नई सुबह, नई उम्मीद — आज कुछ नया करो।'] },
                noon:      { icon: '☀️', label: 'Good Noon',      quotes: ['शुभ दोपहर! 🌞 दिन का आधा सफर तय हो गया — बाकी भी शानदार होगा।', 'शुभ दोपहर! 🍀 थोड़ा रुको, सांस लो — और फिर पूरी ताकत से आगे बढ़ो।', 'शुभ दोपहर! ✨ मेहनत जारी रखो, मंजिल दूर नहीं है।'] },
                afternoon: { icon: '🌤️', label: 'Good Afternoon', quotes: ['शुभ अपराह्न! 🌼 हर पल को खास बनाओ — यही जिंदगी की सुंदरता है।', 'शुभ अपराह्न! 💪 थकान मत मानो, लक्ष्य करीब है।', 'शुभ अपराह्न! 🌈 अच्छे कर्म करते रहो, अच्छा समय जरूर आएगा।'] },
                evening:   { icon: '🌇', label: 'Good Evening',   quotes: ['शुभ संध्या! 🌆 दिन भर की मेहनत का फल जरूर मिलेगा।', 'शुभ संध्या! 🌙 शाम को सुकून दो अपने मन को — कल फिर नई शुरुआत होगी।', 'शुभ संध्या! 🕊️ आज का दिन बेहतरीन रहा — इसके लिए खुद को शुक्रिया कहो।'] },
                night:     { icon: '🌙', label: 'Good Night',     quotes: ['शुभ रात्रि! 🌟 आज जो किया वो काफी है — चैन से सोओ, कल और बेहतर होगा।', 'शुभ रात्रि! 💫 सपने देखो बड़े — क्योंकि वही कल की हकीकत बनते हैं।', 'शुभ रात्रि! 🌛 रात की खामोशी में खुद से बात करो — जवाब मिल जाएगा।'] }
            };

            function getTimePeriod() {
                const h = new Date().getHours();
                if (h >= 5 && h < 12) return 'morning';
                if (h >= 12 && h < 13) return 'noon';
                if (h >= 13 && h < 17) return 'afternoon';
                if (h >= 17 && h < 21) return 'evening';
                return 'night';
            }

            function init() {
                const today = new Date();
                const monthDay = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                document.getElementById('current-date').textContent = today.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

                const festEl = document.getElementById('current-festival');
                if (festivals[monthDay]) { festEl.textContent = festivals[monthDay]; festEl.style.display = ''; }
                else { festEl.style.display = 'none'; }

                const period = getTimePeriod();
                const wd = wishingQuotes[period];
                document.getElementById('wishing-icon').textContent = wd.icon;
                document.getElementById('wishing-text').textContent = wd.quotes[Math.floor(Math.random() * wd.quotes.length)];
                document.getElementById('time-greeting').textContent = wd.label;
            }

            // DOM refs
            const quoteTextEl   = document.getElementById('quote-text');
            const quoteAuthorEl = document.getElementById('quote-author');
            const quoteTypeEl   = document.getElementById('quote-type');
            const spinner       = document.getElementById('loading-spinner');
            const copyBtn       = document.querySelector('.copy-btn');

            function showLoading() { quoteTextEl.style.visibility='hidden'; quoteAuthorEl.style.visibility='hidden'; quoteTypeEl.style.visibility='hidden'; spinner.style.display='block'; }
            function hideLoading() { quoteTextEl.style.visibility='visible'; quoteAuthorEl.style.visibility='visible'; quoteTypeEl.style.visibility='visible'; spinner.style.display='none'; }

            function animateQuote(text, author, type) {
                [quoteTextEl, quoteAuthorEl, quoteTypeEl].forEach(el => el.classList.remove('fade-in'));
                setTimeout(() => {
                    quoteTextEl.textContent = text;
                    quoteAuthorEl.textContent = '— ' + author;
                    quoteTypeEl.textContent = 'Type: ' + type;
                    [quoteTextEl, quoteAuthorEl, quoteTypeEl].forEach(el => el.classList.add('fade-in'));
                }, 200);
            }

            // Claude API se Hindi quote generate karo
            async function fetchHindiQuote() {
                showLoading();
                try {
                    const res = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 300,
                            system: `You are a Hindi quotes generator. Return ONLY a valid JSON object with exactly these 3 keys:
- "quote": a meaningful Hindi quote (in Devanagari script)
- "author": the author name in Hindi (use "अज्ञात" if unknown)
- "type": the category in Hindi (e.g. प्रेरणा, प्रेम, जीवन, दोस्ती, सफलता, etc.)

Return ONLY the JSON object. No markdown, no extra text.`,
                            messages: [{ role: "user", content: "Give me a random Hindi quote." }]
                        })
                    });
                    const data = await res.json();
                    const raw = data.content.map(b => b.text || '').join('').trim();
                    const clean = raw.replace(/```json|```/g, '').trim();
                    const parsed = JSON.parse(clean);
                    animateQuote(
                        parsed.quote  || 'मेहनत इतनी खामोशी से करो कि सफलता शोर मचा दे।',
                        parsed.author || 'अज्ञात',
                        parsed.type   || 'अज्ञात'
                    );
                } catch (err) {
                    console.error(err);
                    animateQuote('मेहनत इतनी खामोशी से करो कि सफलता शोर मचा दे।', 'अज्ञात', 'प्रेरणा');
                } finally {
                    hideLoading();
                }
            }

            function copyToClipboard() {
                const txt = `"${quoteTextEl.textContent}" ${quoteAuthorEl.textContent} | ${quoteTypeEl.textContent}`;
                navigator.clipboard.writeText(txt).then(() => {
                    toast.show();
                    const icon = copyBtn.querySelector('i');
                    icon.classList.replace('fa-copy','fa-check');
                    copyBtn.classList.add('copied');
                    setTimeout(() => { icon.classList.replace('fa-check','fa-copy'); copyBtn.classList.remove('copied'); }, 2000);
                }).catch(() => alert('Copy failed. Please try again.'));
            }

            function shareQuote() {
                const txt = `"${quoteTextEl.textContent}" ${quoteAuthorEl.textContent}`;
                if (navigator.share) {
                    navigator.share({ title: 'Hindi Quote', text: txt, url: window.location.href }).catch(() => copyToClipboard());
                } else { copyToClipboard(); }
            }

            init();
            fetchHindiQuote();

            document.getElementById('new-quote').addEventListener('click', fetchHindiQuote);
            copyBtn.addEventListener('click', copyToClipboard);
            document.getElementById('share-quote').addEventListener('click', shareQuote);
        });
    </script>
</body>
</html>
